services:
    migrations:
        build:
            context: .
            dockerfile: migrations.Containerfile
        env_file:
            - .env
        image: cv-catalog-app-migrations
        depends_on:
            postgres:
                condition: service_healthy

    app:
        build:
            context: .
            dockerfile: Containerfile
        env_file:
            - .env
        image: cv-catalog-app
        ports:
            - "${APP_LISTEN_PORT}:${APP_LISTEN_PORT}"
        depends_on:
            postgres:
                condition: service_healthy
            migrations:
                condition: service_completed_successfully

    postgres:
        image: postgres:18-alpine
        container_name: postgres-cv-catalog
        environment:
            POSTGRES_PASSWORD: ${DB_PASSWORD}
            POSTGRES_DB: ${DB_NAME}
            POSTGRES_USER: ${DB_USER}
        ports:
            - "${DB_PORT:-5432}:5432"
        volumes:
            - ./.data/db_data:/var/lib/postgresql
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
            interval: 5s
            timeout: 5s
            retries: 5
            start_period: 15s
