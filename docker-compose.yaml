services:
    db:
        image: postgres:18-alpine
        container_name: postgres-cv-catalog
        environment:
            POSTGRES_PASSWORD: ${DB_PASSWORD}
            POSTGRES_DB: ${DB_NAME}
            POSTGRES_USER: ${DB_USER}
        ports:
            - "${DB_PORT:-5432}:5432"
        volumes:
            - ./.data/db_data:/var/lib/postgresql
